name: Release APKs to GitHub Releases

on:
  workflow_dispatch:
    inputs:
      version_prefix:
        description: 'Version majeure et mineure (ex: v1.0)'
        required: true
        default: 'v1.0'
  push:
    branches:
      - main # Se déclenche automatiquement à chaque push validé sur main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Indispensable pour créer une release et modifier les tags du dépôt

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Nécessaire pour récupérer l'historique des tags existants

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Decode Keystore
        run: |
          mkdir -p app
          echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 --decode > app/release.jks

      - name: Generate Gradle Wrapper and Build APKs
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          # Génère dynamiquement le wrapper Gradle sur le runner
          gradle wrapper --gradle-version 8.7
          
          # Rend le script exécutable et lance le build
          chmod +x gradlew
          ./gradlew app:assembleDebug --stacktrace
          ./gradlew app:assembleRelease --stacktrace

      - name: Generate Automatic or Manual Version Tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            PREFIX="${{ github.event.inputs.version_prefix }}"
            PREFIX_CLEAN=$(echo "$PREFIX" | sed 's/^v//')
            
            LAST_PATCH=$(git tag -l "v${PREFIX_CLEAN}.*" | sed "s/v${PREFIX_CLEAN}\.//" | sort -n | tail -n 1)
            if [ -z "$LAST_PATCH" ]; then
              NEXT_PATCH=0
            else
              NEXT_PATCH=$((LAST_PATCH + 1))
            fi
            TAG_NAME="v${PREFIX_CLEAN}.${NEXT_PATCH}"
            echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
            
          else
            LAST_TAG=$(git describe --tags --match "v1.0.*" --abbrev=0 2>/dev/null || echo "v1.0.0")
            echo "Dernier tag détecté : $LAST_TAG"
            
            PREFIX=$(echo "$LAST_TAG" | cut -d. -f1-2)
            PATCH=$(echo "$LAST_TAG" | cut -d. -f3)
            
            if [ -z "$PATCH" ]; then
              NEXT_PATCH=1
            else
              NEXT_PATCH=$((PATCH + 1))
            fi
            
            TAG_NAME="${PREFIX}.${NEXT_PATCH}"
            echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          fi

      - name: Create Git Tag
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git tag ${{ steps.tag.outputs.tag }}
          git push origin ${{ steps.tag.outputs.tag }}

      - name: Publish Release and Upload APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "CamaroDiag Gen5 - Release ${{ steps.tag.outputs.tag }}"
          body: |
            ## 🚗 CamaroDiag Gen5
            - **Version** : `${{ steps.tag.outputs.tag }}`
            - **Type de build** : Automatisé / Signé
            - **APK Debug & Release** disponibles ci-dessous.
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
